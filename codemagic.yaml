workflows:
  ios-app-store:
    name: CMF2026 iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ie.courtmacsherry.festival
      vars:
        XCODE_WORKSPACE: "src/src/CMH Festival.xcworkspace"
        XCODE_SCHEME: "CMH Festival"
        APP_STORE_APPLE_ID: "6779231918"
      xcode: latest
    scripts:
      - name: Install CocoaPods
        script: |
          cd src/src
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number and version
        script: |
          cd src/src
          agvtool new-marketing-version 1.0.1
          LATEST=$(app-store-connect get-latest-build-number "$APP_STORE_APPLE_ID" || echo "0")
          agvtool new-version -all $(($LATEST + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
