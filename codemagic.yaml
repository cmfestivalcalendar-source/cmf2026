workflows:
  ios-app-store:
    name: CMF2026 iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ie.courtmacsherry.festival
      vars:
        XCODE_WORKSPACE: "src/src/CMH Festival.xcworkspace"
        XCODE_SCHEME: "CMH Festival"
        APP_STORE_APPLE_ID: "6779231918"
      xcode: latest
    scripts:
      - name: Install CocoaPods
        script: |
          cd src/src
          pod install
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "ie.courtmacsherry.festival" --type IOS_APP_STORE --create
      - name: Set up signing certificate
        script: |
          keychain initialize
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          cd src/src
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" || echo "0")
          agvtool new-version -all $(($LATEST + 1))
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
