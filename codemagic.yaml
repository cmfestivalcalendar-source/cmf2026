workflows:
  ios-app-store:
    name: CMF2026 iOS App Store Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: "ie.courtmacsherry.festival"
        XCODE_WORKSPACE: "src/Courtmacsherry Harbour Festival 2026.xcworkspace"
        XCODE_SCHEME: "Courtmacsherry Harbour Festival 2026"
        APP_STORE_APPLE_ID: "6779231918"
      xcode: latest
    scripts:
      - name: Install CocoaPods
        script: |
          cd src
          pod install
      - name: Set up code signing
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment build number
        script: |
          LATEST=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          agvtool new-version -all $(($LATEST + 1))
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
